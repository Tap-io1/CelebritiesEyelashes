<style>

/* =========================
   GENERAL
========================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    min-height: 100%;
}

body {
    min-height: 100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #CCCCC3;

    color: #B08D57;

    display: flex;
    justify-content: center;

    padding: 28px 18px 35px;

    position: relative;
    overflow-x: hidden;
}


/* =========================
   SUBTLE BACKGROUND
========================= */

body::before {
    content: "";

    position: fixed;
    inset: 0;

    pointer-events: none;

    background:

        radial-gradient(
            circle at 15% 20%,
            rgba(176,141,87,0.12) 0px,
            rgba(176,141,87,0.12) 2px,
            transparent 3px
        ),

        radial-gradient(
            circle at 85% 75%,
            rgba(176,141,87,0.08) 0px,
            rgba(176,141,87,0.08) 1px,
            transparent 2px
        );

    background-size:
        300px 300px,
        380px 380px;

    z-index: 0;
}


/* =========================
   SOFT GOLD GLOW
========================= */

body::after {
    content: "";

    position: fixed;

    width: 380px;
    height: 380px;

    top: -190px;
    right: -170px;

    background:
        radial-gradient(
            circle,
            rgba(176,141,87,0.12),
            transparent 70%
        );

    pointer-events: none;

    z-index: 0;
}


/* =========================
   CONTAINER
========================= */

.container {
    width: 100%;
    max-width: 480px;

    margin: 0 auto;

    text-align: center;

    position: relative;
    z-index: 1;
}


/* =========================
   LOGO AREA
========================= */

.logo-wrapper {
    width: 100%;
    height: 320px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin-bottom: 8px;
}

.logo {
    width: 100%;
    max-width: 400px;

    max-height: 310px;

    object-fit: contain;

    display: block;
}


/* =========================
   ADDRESS
========================= */

.address {
    font-size: 14px;

    font-weight: 700;

    color: #B08D57;

    margin-top: 5px;
    margin-bottom: 18px;

    letter-spacing: 0.3px;
}


/* =========================
   DIVIDER
========================= */

.divider {
    width: 60px;
    height: 2px;

    margin: 0 auto 27px;

    background: #B08D57;

    border-radius: 20px;

    opacity: 0.9;
}


/* =========================
   BUTTON CONTAINER
========================= */

.buttons {
    width: 100%;

    display: flex;
    flex-direction: column;

    gap: 13px;
}


/* =========================
   BUTTONS
========================= */

.btn {
    width: 100%;

    min-height: 64px;

    display: flex;

    align-items: center;
    justify-content: flex-start;

    padding: 15px 20px;

    color: #B08D57;

    text-decoration: none;

    font-size: 15px;
    font-weight: 700;

    letter-spacing: 0.2px;

    background: rgba(255,255,255,0.08);

    border: 2px solid #B08D57;

    border-radius: 14px;

    box-shadow:
        0 6px 16px rgba(0,0,0,0.08);

    transition:
        transform 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;

    cursor: pointer;
}


/* =========================
   BUTTON HOVER
========================= */

.btn:hover {
    background: rgba(176,141,87,0.10);

    transform: translateY(-2px);

    box-shadow:
        0 9px 20px rgba(0,0,0,0.10);
}


/* =========================
   BUTTON ACTIVE
========================= */

.btn:active {
    transform: scale(0.98);
}


/* =========================
   ICON
========================= */

.icon {
    width: 42px;
    min-width: 42px;

    height: 42px;

    display: flex;

    align-items: center;
    justify-content: center;

    margin-right: 15px;

    color: #B08D57;
}

.icon svg {
    width: 28px;
    height: 28px;

    stroke: currentColor;

    fill: none;

    stroke-width: 1.9;

    stroke-linecap: round;
    stroke-linejoin: round;
}


/* =========================
   BUTTON TEXT
========================= */

.btn-text {
    flex: 1;

    text-align: left;

    color: #B08D57;
}


/* =========================
   PHONE MODAL
========================= */

.phone-modal {
    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,0.55);

    align-items: center;
    justify-content: center;

    padding: 20px;

    z-index: 1000;
}

.phone-modal.active {
    display: flex;
}

.phone-box {
    width: 100%;
    max-width: 380px;

    background: #CCCCC3;

    border: 2px solid #B08D57;

    border-radius: 18px;

    padding: 25px 20px;

    box-shadow:
        0 15px 40px rgba(0,0,0,0.25);

    text-align: center;
}

.phone-title {
    color: #B08D57;

    font-size: 19px;

    font-weight: 800;

    margin-bottom: 20px;
}

.phone-option {
    width: 100%;

    min-height: 55px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin-bottom: 12px;

    color: #B08D57;

    text-decoration: none;

    font-size: 17px;
    font-weight: 800;

    border: 2px solid #B08D57;

    border-radius: 12px;

    background: transparent;
}

.phone-option:hover {
    background: rgba(176,141,87,0.10);
}

.close-phone {
    margin-top: 7px;

    background: none;

    border: none;

    color: #7b6b53;

    font-size: 14px;

    cursor: pointer;
}


/* =========================
   FOOTER
========================= */

.footer-line {
    display: flex;

    align-items: center;
    justify-content: center;

    margin-top: 33px;
}

.footer-line::before,
.footer-line::after {
    content: "";

    width: 55px;
    height: 1px;

    background: #B08D57;

.footer-symbol {

    font-size: 13px;
}

.footer {
    margin-top: 14px;

    font-size: 11px;

    color: #B08D57;

    letter-spacing: 1.3px;
}


/* =========================

========================= */

    }

    .icon svg {
        width: 25px;
        height: 25px;
    }

}

</style>

<script>

function openPhones() {

    document
        .getElementById("phoneModal")
        .classList
        .add("active");

}


function closePhones() {

    document
        .getElementById("phoneModal")
        .classList
        .remove("active");

}


function closeOutside(event) {

    if (event.target.id === "phoneModal") {

        closePhones();

    }

}
